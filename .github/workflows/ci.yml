name: CI

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    env: 
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      SALT: ${{secrets.SALT}}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install package
        run: |
          pip install -r requirements.txt
          pip install -e .[dev]
      
      - name: Run tests
        run: pytest