name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install package
        run: pip install -e .
      
      - name: Install package
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest